# Deprecated for the API service — use /backend/railway.toml instead.
#
# Railway monorepo:
#   API service:      Root Directory=/backend, Config File=/backend/railway.toml
#   Frontend service: Root Directory=/frontend, Config File=/frontend/railway.toml
#
# If this root file is still selected as Config File with Root Directory=/backend,
# startCommand "sh ./start.sh" correctly resolves to backend/start.sh.
[build]
builder = "RAILPACK"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "sh ./start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
